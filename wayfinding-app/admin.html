<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>City Hall analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css?v=3" />
</head>
<body>
<!--
  Calamba City Hall analytics dashboard (revamp, 2026-11-09).
  Staff-PIN sign-in; every data request needs the session it sets
  (api/adminauth.js, lib/gate.js). Pages: js/admin_pages.js; charts:
  js/admin_charts.js; shell: js/admin.js. Icons are drawn here (24x24, 2 px
  strokes), no icon library.
-->

<main id="signin" class="signin" hidden>
  <div class="signin-card">
    <svg class="signin-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <h1>Calamba City Hall analytics</h1>
    <p id="signinMsg" class="signin-msg">Enter the staff PIN to see the analytics.</p>
    <form id="pinForm" class="pin-form">
      <label for="pinInput">Staff PIN</label>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" required />
      <p id="pinError" class="error" role="alert"></p>
      <button id="pinBtn" class="btn" type="submit">Open the dashboard</button>
    </form>
    <a class="link" href="/">Back to the app</a>
  </div>
</main>

<div id="shell" class="shell" hidden>
  <nav id="nav" class="sidenav" aria-label="Dashboard pages">
    <div class="brand">City Hall analytics</div>
    <a href="?page=overview" data-page="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Overview</a>
    <a href="?page=questions" data-page="questions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/></svg>Questions</a>
    <a href="?page=hottimes" data-page="hottimes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hot times</a>
    <a href="?page=speed" data-page="speed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4-5"/></svg>Speed</a>
    <a href="?page=routes" data-page="routes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>Routes</a>
    <a href="?page=data" data-page="data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Data</a>
    <hr />
    <a href="/?staff=1" class="nav-ext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>Map editor</a>
    <a href="/" class="nav-ext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to the app</a>
    <div class="nav-bottom">
      <button id="themeBtn" class="btn-quiet" type="button">Light theme</button>
      <button id="signoutBtn" class="btn-quiet" type="button">Sign out</button>
    </div>
  </nav>
  <div id="backdrop" class="backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="pageTitle">Overview</h1>
      <button id="rangeBtn" class="range-btn" type="button" aria-expanded="false" aria-controls="rangebar">All time</button>
      <span id="updated" class="updated" aria-live="polite"></span>
    </header>

    <div id="rangebar" class="rangebar" role="group" aria-label="Date range">
      <div class="range-choices">
        <button type="button" data-range="7d">7 days</button>
        <button type="button" data-range="30d">30 days</button>
        <button type="button" data-range="all">All time</button>
        <button type="button" data-range="custom">Custom</button>
      </div>
      <form id="customDates" class="custom-dates" hidden>
        <label>From <input type="date" id="fromDate" required /></label>
        <label>To <input type="date" id="toDate" required /></label>
        <button class="btn" type="submit">Show</button>
      </form>
      <span id="rangeLabel" class="range-label"></span>
      <div class="csv">
        <a id="csvQuestions" class="btn-quiet" href="/api/analytics?format=csv">Questions CSV</a>
        <a id="csvRoutes" class="btn-quiet" href="/api/navlog?format=csv">Routes CSV</a>
      </div>
    </div>

    <div id="banner" class="banner" role="alert" hidden></div>
    <div id="page" class="page"></div>
  </div>
</div>

<script src="js/admin_charts.js?v=2"></script>
<script src="js/admin_pages.js?v=1"></script>
<script src="js/admin.js?v=1"></script>
</body>
</html>
